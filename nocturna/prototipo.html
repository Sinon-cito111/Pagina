<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rueda Nocturna: recorridos nocturnos en bicicleta por Medellín, de jueves a sábado.">
  <title>Rueda Nocturna | Rueda Libre</title>
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-[#14213D] text-[#FAF6EF]">
  <main>

    <section class="mx-auto flex min-h-screen max-w-3xl flex-col items-start justify-center gap-6 px-6 py-16">

      <p class="rounded-full bg-[#F39A2B] px-4 py-1 text-sm font-bold uppercase tracking-widest text-[#14213D]">
        Nuevo · Jueves a sábado
      </p>

      <h1 class="text-5xl font-extrabold tracking-tight sm:text-7xl">
        Rueda Nocturna
      </h1>

      <p class="max-w-xl text-xl text-[#FAF6EF]/80 sm:text-2xl">
        Descubre Medellín en bici cuando se encienden las luces
      </p>

      <ul class="flex flex-wrap gap-x-10 gap-y-4">
        <li class="text-3xl font-extrabold text-[#F39A2B]">3 rutas</li>
        <li class="text-3xl font-extrabold text-[#F39A2B]">Desde $55.000</li>
      </ul>

      <a href="../paginas/reservas.html" class="mt-2 inline-flex items-center justify-center rounded-full border-2 border-transparent bg-[#F39A2B] px-8 py-3 text-lg font-bold text-[#14213D] transition-colors hover:bg-[#F5AE55] active:bg-[#E48B14] focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#FAF6EF]">
        Inscríbete
      </a>

    </section>

    <section class="mx-auto max-w-3xl px-6 pb-24">

      <h2 class="text-3xl font-extrabold tracking-tight">Botones</h2>
      <p class="mt-2 max-w-xl text-lg text-[#FAF6EF]/80">
        Primera pieza de la librería de componentes: una variante principal, una secundaria y una de contorno.
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-6">

        <button type="button" class="inline-flex items-center justify-center rounded-full border-2 border-transparent bg-[#F39A2B] px-8 py-3 text-lg font-bold text-[#14213D] transition-colors hover:bg-[#F5AE55] active:bg-[#E48B14] focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#FAF6EF]">
          Principal
        </button>

        <button type="button" class="inline-flex items-center justify-center rounded-full border-2 border-transparent bg-[#FAF6EF]/10 px-8 py-3 text-lg font-bold text-[#FAF6EF] transition-colors hover:bg-[#FAF6EF]/20 active:bg-[#FAF6EF]/30 focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#FAF6EF]">
          Secundario
        </button>

        <button type="button" class="inline-flex items-center justify-center rounded-full border-2 border-[#FAF6EF] px-8 py-3 text-lg font-bold text-[#FAF6EF] transition-colors hover:bg-[#FAF6EF] hover:text-[#14213D] active:bg-[#E6DFD2] active:text-[#14213D] focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#FAF6EF]">
          Contorno
        </button>

      </div>
    </section>

  </main>
</body>
</html>
